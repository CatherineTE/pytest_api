name: Run autotests


on: 
  workflow_dispatch:
   inputs:
      diployment target:
        description: select test to run
        required: true
        type: choice
        default: all
        options:
          - all

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest
        run: pytest -v

